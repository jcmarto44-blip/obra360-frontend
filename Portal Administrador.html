<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración — CAASA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --admin-primary: #1b4b8f;
      --admin-primary-light: #e8edf5;
      --admin-success: #2e9e5b;
      --admin-danger: #dc3545;
      --admin-bg: #f4f6f9;
    }
    body {
      background: var(--admin-bg);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .admin-header {
      background: linear-gradient(135deg, var(--admin-primary), #2a6bb0);
      color: white;
      padding: 1.2rem 2rem;
      border-radius: 0 0 1.5rem 1.5rem;
      box-shadow: 0 4px 20px rgba(27, 75, 143, 0.25);
    }
    .admin-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0;
    }
    .admin-header small {
      opacity: 0.8;
      font-size: 0.9rem;
      font-weight: 300;
    }
    .admin-header .nav-links a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      margin: 0 0.75rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .admin-header .nav-links a:hover {
      color: white;
      text-decoration: underline;
    }
    .btn-salir {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-salir:hover {
      background: rgba(255,255,255,0.25);
      color: white;
    }
    .stats-card {
      background: white;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid #e9edf4;
      transition: transform 0.2s;
    }
    .stats-card:hover {
      transform: translateY(-3px);
    }
    .stats-card .number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--admin-primary);
    }
    .stats-card .label {
      font-size: 0.85rem;
      color: #6c7a8a;
      font-weight: 500;
    }
    .cliente-card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid #e9edf4;
      overflow: hidden;
      transition: all 0.25s;
      height: 100%;
    }
    .cliente-card:hover {
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      transform: translateY(-4px);
    }
    .cliente-card .card-header-custom {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #e9edf4;
      background: #fafbfc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cliente-card .card-header-custom .cliente-nombre {
      font-weight: 700;
      font-size: 1.05rem;
      color: #1a2634;
    }
    .badge-estado {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-activo {
      background: #d4edda;
      color: #155724;
    }
    .badge-inactivo {
      background: #f8d7da;
      color: #721c24;
    }
    .cliente-card .card-body-custom {
      padding: 1.25rem;
    }
    .cliente-card .card-body-custom .info-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #3d4a5a;
      margin-bottom: 0.5rem;
    }
    .cliente-card .card-body-custom .info-item i {
      color: var(--admin-primary);
      width: 1.2rem;
      font-size: 1rem;
    }
    .badge-proyecto {
      background: var(--admin-primary-light);
      color: var(--admin-primary);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
      margin: 0.2rem 0.2rem;
    }
    .badge-usuario {
      background: #f0f2f5;
      color: #3d4a5a;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 500;
      display: inline-block;
      margin: 0.15rem 0.15rem;
    }
    .cliente-card .card-footer-custom {
      padding: 0.75rem 1.25rem;
      background: #fafbfc;
      border-top: 1px solid #e9edf4;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .cliente-card .card-footer-custom .btn-sm-custom {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 6px;
      font-weight: 500;
    }
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: white;
      border-radius: 1.5rem;
      border: 2px dashed #dce2eb;
    }
    .empty-state i {
      font-size: 3.5rem;
      color: #bcc9d6;
    }
    .empty-state h5 {
      color: #3d4a5a;
      margin-top: 1rem;
    }
    .empty-state p {
      color: #8a9aa8;
    }
    .btn-action {
      font-weight: 600;
      padding: 0.5rem 1.2rem;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .btn-action i {
      margin-right: 0.4rem;
    }
    .btn-activar {
      background: var(--admin-success);
      color: white;
      border: none;
    }
    .btn-activar:hover {
      background: #218838;
      color: white;
    }
    .btn-suspender {
      background: var(--admin-danger);
      color: white;
      border: none;
    }
    .btn-suspender:hover {
      background: #c82333;
      color: white;
    }
    @media (max-width: 768px) {
      .admin-header { padding: 1rem; }
      .admin-header h1 { font-size: 1.2rem; }
      .stats-card .number { font-size: 1.5rem; }
    }
    .loading {
      text-align: center;
      padding: 2rem;
    }
    .loading .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e9edf4;
      border-top-color: var(--admin-primary);
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes girar {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="admin-header d-flex flex-wrap justify-content-between align-items-center">
    <div>
      <h1><i class="bi bi-gear-fill me-2"></i>Panel de Administración</h1>
      <small>Gestión de Clientes, Proyectos y Usuarios</small>
    </div>
    <div class="nav-links d-flex align-items-center gap-2 mt-2 mt-md-0">
      <span id="adminUser" class="text-white me-2" style="opacity:0.8;font-size:0.9rem;">
        <i class="bi bi-person-circle me-1"></i>Admin
      </span>
      <button class="btn-salir" onclick="cerrarSesion()">
        <i class="bi bi-box-arrow-left me-1"></i>Salir
      </button>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div class="container-fluid px-4 py-4">

    <!-- ESTADÍSTICAS RÁPIDAS -->
    <div class="row g-3 mb-4" id="stats-container">
      <div class="col-md-3">
        <div class="stats-card">
          <div class="number" id="stats-clientes">0</div>
          <div class="label"><i class="bi bi-building me-1"></i>Total Clientes</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="number" id="stats-activos">0</div>
          <div class="label"><i class="bi bi-check-circle me-1" style="color:var(--admin-success);"></i>Activos</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="number" id="stats-inactivos">0</div>
          <div class="label"><i class="bi bi-x-circle me-1" style="color:var(--admin-danger);"></i>Inactivos</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stats-card">
          <div class="number" id="stats-proyectos">0</div>
          <div class="label"><i class="bi bi-folder me-1"></i>Proyectos</div>
        </div>
      </div>
    </div>

    <!-- BOTONES DE ACCIÓN -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button class="btn btn-primary btn-action" onclick="agregarCliente()">
        <i class="bi bi-person-plus"></i>Agregar Cliente
      </button>
      <button class="btn btn-success btn-action" onclick="agregarProyecto()">
        <i class="bi bi-folder-plus"></i>Agregar Proyecto
      </button>
      <button class="btn btn-info btn-action text-white" onclick="agregarUsuario()">
        <i class="bi bi-person-add"></i>Agregar Usuario Base
      </button>
    </div>

    <!-- LISTA DE CLIENTES -->
    <div id="lista-clientes">
      <div class="loading">
        <div class="spinner"></div>
        <p>Cargando clientes...</p>
      </div>
    </div>

    <div class="mt-4 pt-2 text-center text-muted border-top" style="font-size:0.8rem;">
      <i class="bi bi-database me-1"></i> Los datos se guardan en el servidor.
    </div>
  </div>

  <script>
    // ============================================================
    // CONFIGURACIÓN
    // ============================================================
    const API_URL = window.location.origin;

    // ============================================================
    // VERIFICAR SESIÓN
    // ============================================================
    function verificarSesion() {
      const token = localStorage.getItem('token');
      const rol = localStorage.getItem('rol');
      
      if (!token || rol !== 'admin') {
        window.location.href = 'index.html';
      }
      
      document.getElementById('adminUser').innerHTML = '<i class="bi bi-person-circle me-1"></i>' + localStorage.getItem('usuario') || 'Admin';
    }

    function cerrarSesion() {
      localStorage.removeItem('token');
      localStorage.removeItem('rol');
      localStorage.removeItem('cliente_id');
      localStorage.removeItem('cliente_nombre');
      localStorage.removeItem('usuario');
      window.location.href = 'index.html';
    }

    // ============================================================
    // OBTENER TOKEN
    // ============================================================
    function getToken() {
      return localStorage.getItem('token');
    }

    // ============================================================
    // RENDERIZAR LISTA Y ESTADÍSTICAS (DESDE API)
    // ============================================================
    async function renderizar() {
      const contenedor = document.getElementById('lista-clientes');
      const token = getToken();

      if (!token) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/admin/clientes?token=${token}`);
        
        if (response.status === 403) {
          alert('Sesión expirada. Inicia sesión nuevamente.');
          cerrarSesion();
          return;
        }

        const clientes = await response.json();

        // Estadísticas
        let totalProyectos = 0;
        let activos = 0;
        let inactivos = 0;
        clientes.forEach(c => {
          // Los proyectos los obtenemos por separado, pero usamos los que vienen
          if (c.activo !== false) activos++;
          else inactivos++;
        });

        document.getElementById('stats-clientes').textContent = clientes.length;
        document.getElementById('stats-activos').textContent = activos;
        document.getElementById('stats-inactivos').textContent = inactivos;
        
        // Obtener proyectos de todos los clientes
        let totalProyectosReal = 0;
        for (const cliente of clientes) {
          try {
            const projResponse = await fetch(`${API_URL}/clientes/${cliente.id}/proyectos?token=${token}`);
            if (projResponse.ok) {
              const proyectos = await projResponse.json();
              totalProyectosReal += proyectos.length;
              cliente._proyectos = proyectos;
            }
          } catch(e) {
            cliente._proyectos = [];
          }
        }
        document.getElementById('stats-proyectos').textContent = totalProyectosReal;

        if (clientes.length === 0) {
          contenedor.innerHTML = `
            <div class="empty-state">
              <i class="bi bi-building"></i>
              <h5>No hay clientes registrados</h5>
              <p>Haz clic en <strong>"Agregar Cliente"</strong> para comenzar a gestionar tus clientes.</p>
            </div>
          `;
          return;
        }

        let html = '<div class="row g-4">';
        for (const cliente of clientes) {
          const proyectos = cliente._proyectos || [];
          const proyectosHtml = proyectos.length > 0
            ? proyectos.map(p => `<span class="badge-proyecto"><i class="bi bi-folder2-open me-1"></i>${p.nombre_proyecto}</span>`).join(' ')
            : '<span class="text-muted" style="font-size:0.85rem;"><i class="bi bi-folder-x me-1"></i>Sin proyectos</span>';

          const estadoLabel = cliente.activo !== false ? '✅ Activo' : '⛔ Inactivo';
          const estadoBadge = cliente.activo !== false ? 'badge-activo' : 'badge-inactivo';

          html += `
            <div class="col-md-6 col-xl-4">
              <div class="cliente-card">
                <div class="card-header-custom">
                  <span class="cliente-nombre"><i class="bi bi-building me-2" style="color:var(--admin-primary);"></i>${cliente.nombre}</span>
                  <span class="badge-estado ${estadoBadge}">${estadoLabel}</span>
                </div>
                <div class="card-body-custom">
                  <div class="info-item">
                    <i class="bi bi-tag"></i>
                    <span><strong>Modelo:</strong> ${cliente.modelo_gestion || 'No especificado'}</span>
                  </div>
                  <div class="info-item">
                    <i class="bi bi-person"></i>
                    <span><strong>Usuario:</strong> ${cliente.usuario}</span>
                  </div>
                  <div class="info-item">
                    <i class="bi bi-folder"></i>
                    <span><strong>Proyectos:</strong> ${proyectos.length}</span>
                  </div>
                  <div class="info-item">
                    <i class="bi bi-calendar3"></i>
                    <span><strong>Desde:</strong> ${cliente.fecha_creacion || '—'}</span>
                  </div>
                  <div class="mt-2">
                    <strong style="font-size:0.8rem;color:#6c7a8a;">Proyectos:</strong><br>
                    ${proyectosHtml}
                  </div>
                </div>
                <div class="card-footer-custom">
                  <button class="btn btn-outline-primary btn-sm-custom" onclick="verDetalle(${cliente.id})">
                    <i class="bi bi-eye"></i> Ver
                  </button>
                  <button class="btn btn-outline-secondary btn-sm-custom" onclick="editarCliente(${cliente.id})">
                    <i class="bi bi-pencil"></i> Editar
                  </button>
                  ${cliente.activo !== false 
                    ? `<button class="btn btn-suspender btn-sm-custom" onclick="cambiarEstado(${cliente.id}, false)">
                        <i class="bi bi-pause-circle"></i> Suspender
                      </button>`
                    : `<button class="btn btn-activar btn-sm-custom" onclick="cambiarEstado(${cliente.id}, true)">
                        <i class="bi bi-play-circle"></i> Activar
                      </button>`
                  }
                  <button class="btn btn-outline-danger btn-sm-custom" onclick="eliminarCliente(${cliente.id})">
                    <i class="bi bi-trash3"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        }
        html += '</div>';
        contenedor.innerHTML = html;

      } catch (error) {
        console.error('Error al cargar clientes:', error);
        contenedor.innerHTML = `
          <div class="empty-state">
            <i class="bi bi-exclamation-triangle"></i>
            <h5>Error al cargar clientes</h5>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // ============================================================
    // ACCIONES CON API REAL
    // ============================================================

    // Agregar Cliente
    async function agregarCliente() {
      const nombre = prompt('Nombre del Cliente (ej. Coppel, ALSUPER, Prologis):');
      if (!nombre) return;
      
      const modelo_gestion = prompt('Modelo de Gestión (ej. desarrollador, constructora):');
      if (!modelo_gestion) return;
      
      const usuario = prompt('Usuario para el cliente (ej. coppel_01):');
      if (!usuario) return;
      
      const password = prompt('Contraseña para el cliente:');
      if (!password) return;

      const token = getToken();
      if (!token) {
        alert('Sesión expirada.');
        cerrarSesion();
        return;
      }

      try {
        const response = await fetch(`${API_URL}/admin/clientes?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, modelo_gestion, usuario, password })
        });

        const data = await response.json();

        if (!response.ok) {
          alert('❌ Error: ' + (data.detail || data.mensaje || 'Error desconocido'));
          return;
        }

        alert('✅ Cliente creado correctamente.');
        renderizar();

      } catch (error) {
        alert('❌ Error de conexión: ' + error.message);
      }
    }

    // Agregar Proyecto
    async function agregarProyecto() {
      const token = getToken();
      if (!token) {
        alert('Sesión expirada.');
        cerrarSesion();
        return;
      }

      try {
        // Obtener lista de clientes
        const response = await fetch(`${API_URL}/admin/clientes?token=${token}`);
        const clientes = await response.json();

        if (clientes.length === 0) {
          alert('⚠️ Primero debes agregar un cliente.');
          return;
        }

        const lista = clientes.map(c => `${c.nombre} (ID: ${c.id})`).join('\n');
        const clienteId = prompt(`Selecciona el cliente escribiendo su ID:\n${lista}`);
        if (!clienteId) return;

        const cliente = clientes.find(c => c.id === parseInt(clienteId));
        if (!cliente) {
          alert('❌ Cliente no encontrado.');
          return;
        }

        const nombre_proyecto = prompt('Nombre del Proyecto:');
        if (!nombre_proyecto) return;

        const response2 = await fetch(`${API_URL}/admin/clientes/${cliente.id}/proyectos?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre_proyecto })
        });

        const data = await response2.json();

        if (!response2.ok) {
          alert('❌ Error: ' + (data.detail || data.mensaje || 'Error desconocido'));
          return;
        }

        alert('✅ Proyecto creado correctamente.');
        renderizar();

      } catch (error) {
        alert('❌ Error de conexión: ' + error.message);
      }
    }

    // Agregar Usuario Base (equipo)
    async function agregarUsuario() {
      const token = getToken();
      if (!token) {
        alert('Sesión expirada.');
        cerrarSesion();
        return;
      }

      try {
        // Obtener lista de clientes
        const response = await fetch(`${API_URL}/admin/clientes?token=${token}`);
        const clientes = await response.json();

        if (clientes.length === 0) {
          alert('⚠️ Primero debes agregar un cliente.');
          return;
        }

        const lista = clientes.map(c => `${c.nombre} (ID: ${c.id})`).join('\n');
        const clienteId = prompt(`Selecciona el cliente escribiendo su ID:\n${lista}`);
        if (!clienteId) return;

        const cliente = clientes.find(c => c.id === parseInt(clienteId));
        if (!cliente) {
          alert('❌ Cliente no encontrado.');
          return;
        }

        // Obtener proyectos del cliente
        const projResponse = await fetch(`${API_URL}/clientes/${cliente.id}/proyectos?token=${token}`);
        const proyectos = await projResponse.json();

        if (proyectos.length === 0) {
          alert('⚠️ El cliente no tiene proyectos. Primero crea un proyecto.');
          return;
        }

        const projLista = proyectos.map(p => `${p.nombre_proyecto} (ID: ${p.id})`).join('\n');
        const proyectoId = prompt(`Selecciona el proyecto escribiendo su ID:\n${projLista}`);
        if (!proyectoId) return;

        const proyecto = proyectos.find(p => p.id === parseInt(proyectoId));
        if (!proyecto) {
          alert('❌ Proyecto no encontrado.');
          return;
        }

        const rol = prompt('Rol (Gerente de Construcción, Superintendente, Residente Obra Civil, Residente Instalaciones, Residente Administración):');
        if (!rol) return;

        const usuario = prompt('Nombre de usuario:');
        if (!usuario) return;

        const password = prompt('Contraseña:');
        if (!password) return;

        const response2 = await fetch(`${API_URL}/clientes/${cliente.id}/equipo?token=${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proyecto_id: proyecto.id, rol, usuario, password })
        });

        const data = await response2.json();

        if (!response2.ok) {
          alert('❌ Error: ' + (data.detail || data.mensaje || 'Error desconocido'));
          return;
        }

        alert(`✅ Usuario ${usuario} creado correctamente.`);
        renderizar();

      } catch (error) {
        alert('❌ Error de conexión: ' + error.message);
      }
    }

    // Cambiar estado
    async function cambiarEstado(clienteId, activo) {
      const token = getToken();
      if (!token) {
        alert('Sesión expirada.');
        cerrarSesion();
        return;
      }

      try {
        const response = await fetch(`${API_URL}/admin/clientes/${clienteId}/estado?token=${token}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ activo })
        });

        const data = await response.json();

        if (!response.ok) {
          alert('❌ Error: ' + (data.detail || data.mensaje || 'Error desconocido'));
          return;
        }

        const estado = activo ? 'ACTIVADO' : 'SUSPENDIDO';
        alert(`✅ Cliente ${estado} correctamente.`);
        renderizar();

      } catch (error) {
        alert('❌ Error de conexión: ' + error.message);
      }
    }

    // Ver detalle
    async function verDetalle(clienteId) {
      const token = getToken();
      if (!token) {
        alert('Sesión expirada.');
        cerrarSesion();
        return;
      }

      try {
        const response = await fetch(`${API_URL}/admin/clientes?token=${token}`);
        const clientes = await response.json();
        const cliente = clientes.find(c => c.id === clienteId);
        
        if (!cliente) {
          alert('Cliente no encontrado.');
          return;
        }

        const projResponse = await fetch(`${API_URL}/clientes/${cliente.id}/proyectos?token=${token}`);
        const proyectos = await projResponse.json();

        const projNombres = proyectos.map(p => p.nombre_proyecto).join(', ') || 'Ninguno';

        alert(`📋 DETALLE DE CLIENTE\n\nNombre: ${cliente.nombre}\nModelo: ${cliente.modelo_gestion || 'No especificado'}\nUsuario: ${cliente.usuario}\nEstado: ${cliente.activo ? 'Activo' : 'Inactivo'}\nProyectos: ${projNombres}\nCreación: ${cliente.fecha_creacion || '—'}`);

      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    // Editar cliente
    async function editarCliente(clienteId) {
      const token = getToken();
      if (!token) {
        alert('Sesión expirada.');
        cerrarSesion();
        return;
      }

      try {
        const response = await fetch(`${API_URL}/admin/clientes?token=${token}`);
        const clientes = await response.json();
        const cliente = clientes.find(c => c.id === clienteId);
        
        if (!cliente) {
          alert('Cliente no encontrado.');
          return;
        }

        // Solo podemos editar el nombre por ahora (el backend no tiene endpoint de edición)
        // Usamos el mismo endpoint de creación pero con PUT? No existe.
        // Por ahora mostramos mensaje
        alert('📝 Para editar el nombre, contacta al administrador del sistema.\n\nNombre actual: ' + cliente.nombre);

      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    // Eliminar cliente
    async function eliminarCliente(clienteId) {
      if (!confirm('⚠️ ¿Eliminar este cliente y TODOS sus proyectos y usuarios?')) return;

      const token = getToken();
      if (!token) {
        alert('Sesión expirada.');
        cerrarSesion();
        return;
      }

      try {
        // Nota: El backend no tiene endpoint DELETE para clientes.
        // Se podría desactivar en lugar de eliminar.
        alert('⚠️ Para eliminar un cliente, primero debes suspenderlo.\n\nUsa el botón "Suspender" para desactivar la cuenta.');

      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    // ============================================================
    // INICIALIZAR
    // ============================================================
    verificarSesion();
    renderizar();
  </script>

</body>
</html>
